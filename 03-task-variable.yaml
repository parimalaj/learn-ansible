- name: "Learn Variables in ansible"
  hosts: localhost
  connection: local

  vars:
    name: "Parimala"
    course: "Devops"
    duration: "120hrs"

  tasks: 
    - name: "print variable"
      debug:
        msg: "My name is {{ name }} and I am learning {{ course }} and the duration is {{ duration }}"
    
  tasks: 
      - name: "print variable"
        course: "Ansible"
        debug:
          msg: "My name is {{ name }} and I am learning {{ course }} and the duration is {{ duration }}"


    
