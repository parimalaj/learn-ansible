- name: "load the student file"
  hosts: localhost
  connection: local

  vars_files:
    - student-info.yaml

  tasks:
    - name: "print the student info"
      debug:
        msg: "My name is {{ name }} and I am {{ age }} years old and my first skill is {{ skills[0] }}"

    - name: "print all skills"
      debug:
        var: skills 
